plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xinto.weakauth'
    compileSdk 34

    defaultConfig {
        applicationId "com.xinto.weakauth"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "1.2-A14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', includes: ['*.jar'])
}
